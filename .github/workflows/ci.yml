# PR ごとに JS の構文チェックと物理エンジンの単体テストを実行する
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ブラウザ側のスクリプト(render.js / charts.js / main.js)はテストで読み込まれないので、構文だけは確認する
      - name: 構文チェック
        run: |
          for f in js/*.js tools/*.js test/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: 単体テスト
        run: npm test
